# ============================================================
# Windows Installer (.exe) otomatik derleme
# ============================================================
# Tetikleyiciler:
#   • v* tag push'u (or: v2.0.1) → derle + GitHub Release'e yukle
#   • Manuel (workflow_dispatch)  → derle + artifact olarak yukle
#
# Cikti: MailTrustAI-Client-Setup-X.Y.Z.exe
# Musteri bu .exe'yi GitHub Releases'ten indirip cift tiklar.
# ============================================================
name: build-windows-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manuel derleme nedeni'
        required: false
        default: 'manual build'

permissions:
  contents: write   # Release'e dosya yukleyebilmek icin

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inno Setup kur
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          # iscc.exe yolunu dogrula
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe bulunamadi: $iscc" }
          Write-Host "Inno Setup OK: $iscc"

      - name: Sürüm belirle
        shell: pwsh
        run: |
          # Tag push'ta: v2.1.0 -> "2.1.0"
          # Manuel tetiklemede: tarih bazli dev surumu
          if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
              $ver = $Matches[1]
          } else {
              $ver = "$(Get-Date -Format 'yyyy.MM.dd')-dev"
          }
          Write-Host "Uygulama surumu: $ver"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installer derle
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $ver  = $env:APP_VERSION
          Write-Host "Derleniyor: MailTrustAI-Client-Setup-$ver.exe"
          # /DMyAppVersion .iss icindeki #define degerini override eder
          & $iscc 'installer\MailTrustAIClient.iss' "/DMyAppVersion=$ver"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derleme basarisiz (exit=$LASTEXITCODE)" }
          Write-Host "Cikti dosyalari:"
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "  $($_.Name) ($([Math]::Round($_.Length/1MB,1)) MB)" }

      - name: Artifact yukle (her derlemede)
        uses: actions/upload-artifact@v4
        with:
          name: MailTrustAI-Client-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release'e ekle (yalniz tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            ## MailTrustAI Client - Windows Kurulum

            Asagidaki **MailTrustAI-Client-Setup-*.exe** dosyasini indirip cift tiklayin.

            Kurulum sihirbazi:
            1. Git + Docker Desktop (yoksa kurar)
            2. Lisans anahtari + license-server URL sorar
            3. Otomatik yapilandirir, derler ve baslatir (port 3000)

            > Not: Installer imzasiz oldugundan Windows "Bilinmeyen yayinci"
            > uyarisi verebilir. "Daha fazla bilgi → Yine de calistir" deyin.
